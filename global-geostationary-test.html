<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Global Geostationary Weather Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      /*
        Keep only a narrow visual separation between the two
        full-disk views.
      */
      gap: 10px;
    }

    /*
      Push each panel close to the maximum size that will fit
      side-by-side on a 16:9 display while retaining a small
      center gap.
    */
    .hemisphere {
      position: relative;
      width: min(49vw, 98vh);
      height: min(49vw, 98vh);
      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    .image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /*
      GOES:
      Preserve the complete NOAA source image with its original
      embedded logo and annotation strip.
    */
    #goes-image {
      transform: scale(1.00);
      transform-origin: center center;
    }

    /*
      Meteosat:
      The EUMETSAT WMS frame has more black space surrounding
      the disk, so keep the existing enlargement.

      The image is also somewhat darker than the NOAA GeoColor
      product. These modest display-only adjustments bring the
      two products closer visually without changing the source.
    */
    #meteosat-image {
      transform: scale(1.20);
      transform-origin: center center;

      filter:
        brightness(1.13)
        contrast(1.05)
        saturate(1.06);
    }

    /*
      Meteosat annotation strip.

      NOAA's strip is very shallow and begins to the right of
      the lower-left logo. Mirror that structure here.

      This strip is an overlay. It does not resize or displace
      the Meteosat imagery.
    */
    .meteosat-footer {
      position: absolute;
      left: 7.4%;
      right: 0;
      bottom: 0;

      height: 13px;
      background: #fff;
      color: #111;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 10px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 7px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;

      pointer-events: none;
    }

    .meteosat-footer-text {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /*
      Older emblem-style EUMETSAT logo.

      Position and visual weight are intentionally matched to
      NOAA's lower-left badge: the logo sits above and overlaps
      the annotation strip rather than living inside the strip.
    */
    .meteosat-logo {
      position: absolute;
      left: 1.0%;
      bottom: 4px;

      width: 62px;
      height: 50px;

      object-fit: contain;

      z-index: 6;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <section
    class="hemisphere"
    aria-label="Western Hemisphere"
  >
    <div class="image-wrap">
      <img
        id="goes-image"
        alt="Latest GOES-19 GeoColor full-disk imagery"
      >
    </div>
  </section>

  <section
    class="hemisphere"
    aria-label="Eastern Hemisphere"
  >
    <div class="image-wrap">
      <img
        id="meteosat-image"
        alt="Latest Meteosat-12 GeoColour full-disk imagery"
      >

      <div
        class="meteosat-footer"
        aria-hidden="true"
      >
        <div
          class="meteosat-footer-text"
          id="meteosat-footer-text"
        >
          METEOSAT-12 · GEOCOLOUR Composite
        </div>
      </div>

      <img
        class="meteosat-logo"
        id="eumetsat-logo"
        alt=""
        aria-hidden="true"
      >
    </div>
  </section>

  <script>
    const GOES_IMAGE =
      document.getElementById("goes-image");

    const METEOSAT_IMAGE =
      document.getElementById("meteosat-image");

    const METEOSAT_FOOTER_TEXT =
      document.getElementById(
        "meteosat-footer-text"
      );

    const EUMETSAT_LOGO =
      document.getElementById(
        "eumetsat-logo"
      );

    const IMAGE_INTERVAL_MINUTES = 10;
    const GOES_CANDIDATES = 12;
    const GOES_DELAY_MINUTES = 20;

    /*
      For the aesthetic test, use the older compact EUMETSAT
      emblem from Wikimedia Commons. We can later save a local
      copy in the repository if this treatment is retained.
    */
    const EUMETSAT_LOGO_URL =
      "https://commons.wikimedia.org/wiki/" +
      "Special:Redirect/file/EUMETSAT_logo.svg";

    const METEOSAT_WMS_BASE =
      "https://view.eumetsat.int/geoserver/wms" +
      "?service=WMS" +
      "&version=1.3.0" +
      "&request=GetMap" +
      "&layers=" +
      "mtg_fd:rgb_geocolour" +
      "&bbox=-6500000,-6500000,6500000,6500000" +
      "&width=1800" +
      "&height=1800" +
      "&srs=AUTO:97004,9001,0,0" +
      "&styles=" +
      "&format=image/jpeg" +
      "&bgcolor=0x000000";

    const REFRESH_INTERVAL_MS =
      10 * 60 * 1000;

    function pad(value, length = 2) {
      return String(value).padStart(
        length,
        "0"
      );
    }

    function getJulianDay(date) {
      const startOfYear =
        Date.UTC(
          date.getUTCFullYear(),
          0,
          0
        );

      return Math.floor(
        (
          date.getTime() -
          startOfYear
        ) / 86400000
      );
    }

    function roundDownToTenMinutes(date) {
      const rounded =
        new Date(date);

      rounded.setUTCSeconds(0, 0);

      const minute =
        Math.floor(
          rounded.getUTCMinutes() /
          IMAGE_INTERVAL_MINUTES
        ) * IMAGE_INTERVAL_MINUTES;

      rounded.setUTCMinutes(minute);

      return rounded;
    }

    function buildGoesUrl(date) {
      const year =
        date.getUTCFullYear();

      const julianDay =
        pad(
          getJulianDay(date),
          3
        );

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      const timestamp =
        `${year}${julianDay}${hour}${minute}`;

      return (
        "https://cdn.star.nesdis.noaa.gov/" +
        "GOES19/ABI/FD/GEOCOLOR/" +
        `${timestamp}_GOES19-ABI-FD-GEOCOLOR-` +
        "1808x1808.jpg"
      );
    }

    function testImage(url) {
      return new Promise(
        (resolve) => {
          const test =
            new Image();

          test.onload =
            () => resolve(true);

          test.onerror =
            () => resolve(false);

          test.src =
            `${url}?cb=${Date.now()}`;
        }
      );
    }

    async function loadLatestGoes() {
      const start =
        roundDownToTenMinutes(
          new Date()
        );

      start.setUTCMinutes(
        start.getUTCMinutes() -
        GOES_DELAY_MINUTES
      );

      for (
        let i = 0;
        i < GOES_CANDIDATES;
        i++
      ) {
        const candidateDate =
          new Date(
            start.getTime() -
            i *
            IMAGE_INTERVAL_MINUTES *
            60000
          );

        const url =
          buildGoesUrl(candidateDate);

        if (await testImage(url)) {
          GOES_IMAGE.src =
            `${url}?cb=${Date.now()}`;

          return;
        }
      }
    }

    function formatMeteosatFooter(date) {
      const day =
        pad(date.getUTCDate());

      const monthNames = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"
      ];

      const month =
        monthNames[
          date.getUTCMonth()
        ];

      const year =
        date.getUTCFullYear();

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      return (
        `${day} ${month} ${year} ` +
        `${hour}:${minute}Z · ` +
        "EUMETSAT · METEOSAT-12 · " +
        "GEOCOLOUR Composite"
      );
    }

    function loadLatestMeteosat() {
      /*
        The WMS endpoint supplies the latest available image.
        For this aesthetic test, the displayed time is rounded
        down to the nearest preceding ten-minute interval.

        We will replace this with the actual product timestamp
        once the composition is finalized.
      */
      const timestampDate =
        roundDownToTenMinutes(
          new Date()
        );

      METEOSAT_IMAGE.src =
        `${METEOSAT_WMS_BASE}&cb=${Date.now()}`;

      METEOSAT_FOOTER_TEXT.textContent =
        formatMeteosatFooter(
          timestampDate
        );
    }

    function refreshImages() {
      loadLatestGoes();
      loadLatestMeteosat();
    }

    EUMETSAT_LOGO.src =
      EUMETSAT_LOGO_URL;

    refreshImages();

    setInterval(
      refreshImages,
      REFRESH_INTERVAL_MS
    );
  </script>
</body>
</html>
