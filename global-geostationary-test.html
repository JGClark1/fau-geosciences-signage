<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Global Geostationary Weather Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    /*
      Keep both panels at roughly 95% of the original test size.
    */
    .hemisphere {
      position: relative;
      width: min(47.5vw, 95vh);
      height: min(47.5vw, 95vh);
      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    .image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /*
      GOES:
      Keep NOAA's complete source image untouched.
      The original footer remains baked into the JPG.
    */
    #goes-image {
      transform: scale(1.00);
      transform-origin: center center;
    }

    /*
      Meteosat:
      Retain the 1.20 scale used in the earlier test so the
      visible disk has a comparable apparent diameter.

      A modest brightness/contrast/saturation adjustment helps
      the Meteosat image sit more comfortably beside GOES.
      These are intentionally conservative values that we can
      tune visually after the next test.
    */
    #meteosat-image {
      transform: scale(1.20);
      transform-origin: center center;
      filter:
        brightness(1.09)
        contrast(1.04)
        saturate(1.05);
    }

    /*
      Meteosat footer:
      This is an OVERLAY inside the image frame, so it does not
      push or resize the satellite imagery.

      NOAA's embedded footer is very small, so the typography
      here is intentionally restrained.
    */
    .meteosat-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28px;
      background: #fff;
      color: #111;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 54px 0 58px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;

      pointer-events: none;
    }

    /*
      Temporary circular EUMETSAT-style source badge.
      This is deliberately a simple test badge rather than
      depending on an external logo URL.
    */
    .meteosat-badge {
      position: absolute;
      left: 8px;
      bottom: 5px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      z-index: 6;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #165d9b;
      border: 2px solid #fff;
      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9px;
      font-weight: 700;
      letter-spacing: -0.3px;

      pointer-events: none;
    }

    .meteosat-footer-text {
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      width: 100%;
    }
  </style>
</head>

<body>
  <section
    class="hemisphere"
    aria-label="Western Hemisphere"
  >
    <div class="image-wrap">
      <img
        id="goes-image"
        alt="Latest GOES-19 GeoColor full-disk imagery"
      >
    </div>
  </section>

  <section
    class="hemisphere"
    aria-label="Eastern Hemisphere"
  >
    <div class="image-wrap">
      <img
        id="meteosat-image"
        alt="Latest Meteosat-12 GeoColour full-disk imagery"
      >

      <div
        class="meteosat-footer"
        aria-hidden="true"
      >
        <div
          class="meteosat-footer-text"
          id="meteosat-footer-text"
        >
          METEOSAT-12 · GEOCOLOUR Composite
        </div>
      </div>

      <div
        class="meteosat-badge"
        aria-hidden="true"
      >
        EUM
      </div>
    </div>
  </section>

  <script>
    const GOES_IMAGE =
      document.getElementById("goes-image");

    const METEOSAT_IMAGE =
      document.getElementById("meteosat-image");

    const METEOSAT_FOOTER_TEXT =
      document.getElementById(
        "meteosat-footer-text"
      );

    const IMAGE_INTERVAL_MINUTES = 10;
    const GOES_CANDIDATES = 12;
    const GOES_DELAY_MINUTES = 20;

    const METEOSAT_WMS_BASE =
      "https://view.eumetsat.int/geoserver/wms" +
      "?service=WMS" +
      "&version=1.3.0" +
      "&request=GetMap" +
      "&layers=" +
      "mtg_fd:rgb_geocolour" +
      "&bbox=-6500000,-6500000,6500000,6500000" +
      "&width=1800" +
      "&height=1800" +
      "&srs=AUTO:97004,9001,0,0" +
      "&styles=" +
      "&format=image/jpeg" +
      "&bgcolor=0x000000";

    const REFRESH_INTERVAL_MS =
      10 * 60 * 1000;

    function pad(value, length = 2) {
      return String(value).padStart(
        length,
        "0"
      );
    }

    function getJulianDay(date) {
      const startOfYear =
        Date.UTC(
          date.getUTCFullYear(),
          0,
          0
        );

      return Math.floor(
        (
          date.getTime() -
          startOfYear
        ) / 86400000
      );
    }

    function roundDownToTenMinutes(date) {
      const rounded =
        new Date(date);

      rounded.setUTCSeconds(0, 0);

      const minute =
        Math.floor(
          rounded.getUTCMinutes() /
          IMAGE_INTERVAL_MINUTES
        ) * IMAGE_INTERVAL_MINUTES;

      rounded.setUTCMinutes(minute);

      return rounded;
    }

    function buildGoesUrl(date) {
      const year =
        date.getUTCFullYear();

      const julianDay =
        pad(
          getJulianDay(date),
          3
        );

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      const timestamp =
        `${year}${julianDay}${hour}${minute}`;

      return (
        "https://cdn.star.nesdis.noaa.gov/" +
        "GOES19/ABI/FD/GEOCOLOR/" +
        `${timestamp}_GOES19-ABI-FD-GEOCOLOR-` +
        "1808x1808.jpg"
      );
    }

    function testImage(url) {
      return new Promise(
        (resolve) => {
          const test =
            new Image();

          test.onload =
            () => resolve(true);

          test.onerror =
            () => resolve(false);

          test.src =
            `${url}?cb=${Date.now()}`;
        }
      );
    }

    async function loadLatestGoes() {
      const start =
        roundDownToTenMinutes(
          new Date()
        );

      start.setUTCMinutes(
        start.getUTCMinutes() -
        GOES_DELAY_MINUTES
      );

      for (
        let i = 0;
        i < GOES_CANDIDATES;
        i++
      ) {
        const candidateDate =
          new Date(
            start.getTime() -
            i *
            IMAGE_INTERVAL_MINUTES *
            60000
          );

        const url =
          buildGoesUrl(candidateDate);

        if (await testImage(url)) {
          GOES_IMAGE.src =
            `${url}?cb=${Date.now()}`;

          return;
        }
      }
    }

    function formatMeteosatFooter(date) {
      const day =
        pad(date.getUTCDate());

      const monthNames = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"
      ];

      const month =
        monthNames[
          date.getUTCMonth()
        ];

      const year =
        date.getUTCFullYear();

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      return (
        `${day} ${month} ${year} ` +
        `${hour}:${minute}Z · ` +
        "EUMETSAT · METEOSAT-12 · " +
        "GEOCOLOUR Composite"
      );
    }

    function loadLatestMeteosat() {
      /*
        For this aesthetic test, the displayed timestamp is
        rounded to the nearest preceding ten-minute interval.
        We will replace it with an authoritative data timestamp
        after the visual design is settled.
      */
      const timestampDate =
        roundDownToTenMinutes(
          new Date()
        );

      METEOSAT_IMAGE.src =
        `${METEOSAT_WMS_BASE}&cb=${Date.now()}`;

      METEOSAT_FOOTER_TEXT.textContent =
        formatMeteosatFooter(
          timestampDate
        );
    }

    function refreshImages() {
      loadLatestGoes();
      loadLatestMeteosat();
    }

    refreshImages();

    setInterval(
      refreshImages,
      REFRESH_INTERVAL_MS
    );
  </script>
</body>
</html>
