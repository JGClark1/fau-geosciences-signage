<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Global Geostationary Weather Test v2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    /*
      Corner copy remains entirely in the black negative space.
      The globe arcs themselves provide the taper.
    */
    .header-left,
    .header-right {
      position: absolute;
      top: 18px;
      z-index: 20;
      color: #fff;
      pointer-events: none;
    }

    .header-left {
      left: 20px;
      width: 390px;
      padding-left: 12px;
    }

    .header-left::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1px;
      width: 4px;
      height: 42px;
      background: #4db3ff;
    }

    .title-line {
      display: block;
      margin: 0;
      font-weight: 700;
      line-height: 0.98;
      white-space: nowrap;
    }

    .title-line-1 {
      font-size: 22px;
      letter-spacing: 0.15px;
    }

    .title-line-2 {
      margin-top: 5px;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: 0.05px;
      color: #e8e8e8;
    }

    .header-right {
      right: 14px;
      width: 470px;
      text-align: right;
    }

    .description-line {
      display: block;
      margin: 0 0 3px auto;
      color: #e6e6e6;
      font-weight: 400;
      line-height: 1.12;
      white-space: nowrap;
    }

    .description-line-1,
    .description-line-2,
    .description-line-3 {
      font-size: 14.5px;
      letter-spacing: -0.15px;
      word-spacing: -0.35px;
    }

    /*
      Keep the approved globe size and spacing, but do NOT
      translate the pair downward. The previous 40 px shift
      pushed the NOAA/EUMETSAT logos and attribution strips
      below the viewport.
    */
    .hemisphere {
      position: relative;
      width: min(49vw, 98vh);
      height: min(49vw, 98vh);
      flex: 0 0 auto;
      overflow: hidden;
      background: #000;
    }

    .image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .satellite-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    #goes-image {
      transform: scale(1.00);
      transform-origin: center center;
    }

    #meteosat-image {
      transform: scale(1.20);
      transform-origin: center center;

      filter:
        brightness(1.24)
        contrast(1.03)
        saturate(1.07);
    }

    /*
      Meteosat attribution is intentionally given equal visual
      weight to the baked-in GOES attribution.
    */
    .meteosat-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 10.5px;
      background: #fff;
      color: #111;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 8px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9.5px;
      font-weight: 500;
      line-height: 10.5px;
      white-space: nowrap;

      pointer-events: none;
    }

    .meteosat-footer-text {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;

      transform: translateY(0);
    }

    #eumetsat-logo {
      position: absolute;
      left: 8px;
      bottom: 0;

      width: 94px;
      height: 94px;
      max-width: 94px;
      max-height: 94px;

      object-fit: contain;

      z-index: 6;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div
    class="header-left"
    aria-label="Display title"
  >
    <span class="title-line title-line-1">
      Earth in Motion
    </span>

    <span class="title-line title-line-2">
      The past 48 hours
    </span>
  </div>

  <div
    class="header-right"
    aria-label="Display description"
  >
    <span class="description-line description-line-1">
      Watch weather evolve across Earth
    </span>

    <span class="description-line description-line-2">
      through the changing cycle
    </span>

    <span class="description-line description-line-3">
      of day and night
    </span>
  </div>

  <section
    class="hemisphere"
    aria-label="Western Hemisphere"
  >
    <div class="image-wrap">
      <img
        class="satellite-image"
        id="goes-image"
        alt="Latest GOES-19 GeoColor full-disk imagery"
      >
    </div>
  </section>

  <section
    class="hemisphere"
    aria-label="Eastern Hemisphere"
  >
    <div class="image-wrap">
      <img
        class="satellite-image"
        id="meteosat-image"
        alt="Latest Meteosat-12 GeoColour full-disk imagery"
      >

      <div
        class="meteosat-footer"
        aria-hidden="true"
      >
        <div
          class="meteosat-footer-text"
          id="meteosat-footer-text"
        >
          METEOSAT-12 - GEOCOLOUR Composite
        </div>
      </div>

      <img
        id="eumetsat-logo"
        alt=""
        aria-hidden="true"
      >
    </div>
  </section>

  <script>
    const GOES_IMAGE =
      document.getElementById("goes-image");

    const METEOSAT_IMAGE =
      document.getElementById("meteosat-image");

    const METEOSAT_FOOTER_TEXT =
      document.getElementById(
        "meteosat-footer-text"
      );

    const EUMETSAT_LOGO =
      document.getElementById(
        "eumetsat-logo"
      );

    const IMAGE_INTERVAL_MINUTES = 10;
    const GOES_CANDIDATES = 12;
    const GOES_DELAY_MINUTES = 20;

    const EUMETSAT_LOGO_URL =
      "https://commons.wikimedia.org/wiki/" +
      "Special:Redirect/file/EUMETSAT_logo.svg";

    const METEOSAT_WMS_BASE =
      "https://view.eumetsat.int/geoserver/wms" +
      "?service=WMS" +
      "&version=1.3.0" +
      "&request=GetMap" +
      "&layers=" +
      "mtg_fd:rgb_geocolour" +
      "&bbox=-6500000,-6500000,6500000,6500000" +
      "&width=1800" +
      "&height=1800" +
      "&srs=AUTO:97004,9001,0,0" +
      "&styles=" +
      "&format=image/jpeg" +
      "&bgcolor=0x000000";

    const REFRESH_INTERVAL_MS =
      10 * 60 * 1000;

    function pad(value, length = 2) {
      return String(value).padStart(
        length,
        "0"
      );
    }

    function getJulianDay(date) {
      const startOfYear =
        Date.UTC(
          date.getUTCFullYear(),
          0,
          0
        );

      return Math.floor(
        (
          date.getTime() -
          startOfYear
        ) / 86400000
      );
    }

    function roundDownToTenMinutes(date) {
      const rounded =
        new Date(date);

      rounded.setUTCSeconds(0, 0);

      const minute =
        Math.floor(
          rounded.getUTCMinutes() /
          IMAGE_INTERVAL_MINUTES
        ) * IMAGE_INTERVAL_MINUTES;

      rounded.setUTCMinutes(minute);

      return rounded;
    }

    function buildGoesUrl(date) {
      const year =
        date.getUTCFullYear();

      const julianDay =
        pad(
          getJulianDay(date),
          3
        );

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      const timestamp =
        `${year}${julianDay}${hour}${minute}`;

      return (
        "https://cdn.star.nesdis.noaa.gov/" +
        "GOES19/ABI/FD/GEOCOLOR/" +
        `${timestamp}_GOES19-ABI-FD-GEOCOLOR-` +
        "1808x1808.jpg"
      );
    }

    function testImage(url) {
      return new Promise(
        (resolve) => {
          const test =
            new Image();

          test.onload =
            () => resolve(true);

          test.onerror =
            () => resolve(false);

          test.src =
            `${url}?cb=${Date.now()}`;
        }
      );
    }

    async function loadLatestGoes() {
      const start =
        roundDownToTenMinutes(
          new Date()
        );

      start.setUTCMinutes(
        start.getUTCMinutes() -
        GOES_DELAY_MINUTES
      );

      for (
        let i = 0;
        i < GOES_CANDIDATES;
        i++
      ) {
        const candidateDate =
          new Date(
            start.getTime() -
            i *
            IMAGE_INTERVAL_MINUTES *
            60000
          );

        const url =
          buildGoesUrl(candidateDate);

        if (await testImage(url)) {
          GOES_IMAGE.src =
            `${url}?cb=${Date.now()}`;

          return;
        }
      }
    }

    function formatMeteosatFooter(date) {
      const day =
        pad(date.getUTCDate());

      const monthNames = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"
      ];

      const month =
        monthNames[
          date.getUTCMonth()
        ];

      const year =
        date.getUTCFullYear();

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      return (
        `${day} ${month} ${year} ` +
        `${hour}:${minute}Z - ` +
        "EUMETSAT - METEOSAT-12 - " +
        "GEOCOLOUR Composite"
      );
    }

    function loadLatestMeteosat() {
      const timestampDate =
        roundDownToTenMinutes(
          new Date()
        );

      METEOSAT_IMAGE.src =
        `${METEOSAT_WMS_BASE}&cb=${Date.now()}`;

      METEOSAT_FOOTER_TEXT.textContent =
        formatMeteosatFooter(
          timestampDate
        );
    }

    function refreshImages() {
      loadLatestGoes();
      loadLatestMeteosat();
    }

    EUMETSAT_LOGO.src =
      EUMETSAT_LOGO_URL;

    refreshImages();

    setInterval(
      refreshImages,
      REFRESH_INTERVAL_MS
    );
  </script>
</body>
</html>
