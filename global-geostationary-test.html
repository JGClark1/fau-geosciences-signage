<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Global Geostationary Weather Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .hemisphere {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap {
      position: relative;
      width: min(50vw, 100vh);
      height: min(50vw, 100vh);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /*
      NOAA's 1808 x 1808 product already fills its source
      frame efficiently, so no additional scale is needed.
    */
    #goes-image {
      transform: scale(1.00);
      transform-origin: center center;
    }

    /*
      The Meteosat WMS product contains more black margin
      around the Earth disk. Enlarge it so that the two
      visible hemispheres have comparable diameters.
    */
    #meteosat-image {
      transform: scale(1.20);
      transform-origin: center center;
    }
  </style>
</head>

<body>
  <section class="hemisphere">
    <div class="image-wrap">
      <img
        id="goes-image"
        alt="Latest GOES-19 GeoColor full-disk imagery"
      >
    </div>
  </section>

  <section class="hemisphere">
    <div class="image-wrap">
      <img
        id="meteosat-image"
        alt="Latest Meteosat-12 GeoColour full-disk imagery"
      >
    </div>
  </section>

  <script>
    const GOES_IMAGE =
      document.getElementById("goes-image");

    const METEOSAT_IMAGE =
      document.getElementById("meteosat-image");

    const IMAGE_INTERVAL_MINUTES = 10;
    const GOES_CANDIDATES = 12;
    const GOES_DELAY_MINUTES = 20;

    const METEOSAT_WMS_BASE =
      "https://view.eumetsat.int/geoserver/wms" +
      "?service=WMS" +
      "&version=1.3.0" +
      "&request=GetMap" +
      "&layers=" +
      "mtg_fd:rgb_geocolour" +
      "&bbox=-6500000,-6500000,6500000,6500000" +
      "&width=1800" +
      "&height=1800" +
      "&srs=AUTO:97004,9001,0,0" +
      "&styles=" +
      "&format=image/jpeg" +
      "&bgcolor=0x000000";

    const REFRESH_INTERVAL_MS =
      10 * 60 * 1000;

    function pad(value, length = 2) {
      return String(value).padStart(length, "0");
    }

    function getJulianDay(date) {
      const startOfYear =
        Date.UTC(date.getUTCFullYear(), 0, 0);

      return Math.floor(
        (
          date.getTime() -
          startOfYear
        ) / 86400000
      );
    }

    function roundDownToTenMinutes(date) {
      const rounded =
        new Date(date);

      rounded.setUTCSeconds(0, 0);

      const minute =
        Math.floor(
          rounded.getUTCMinutes() /
          IMAGE_INTERVAL_MINUTES
        ) * IMAGE_INTERVAL_MINUTES;

      rounded.setUTCMinutes(minute);

      return rounded;
    }

    function buildGoesUrl(date) {
      const year =
        date.getUTCFullYear();

      const julianDay =
        pad(
          getJulianDay(date),
          3
        );

      const hour =
        pad(date.getUTCHours());

      const minute =
        pad(date.getUTCMinutes());

      const timestamp =
        `${year}${julianDay}${hour}${minute}`;

      return (
        "https://cdn.star.nesdis.noaa.gov/" +
        "GOES19/ABI/FD/GEOCOLOR/" +
        `${timestamp}_GOES19-ABI-FD-GEOCOLOR-` +
        "1808x1808.jpg"
      );
    }

    function testImage(url) {
      return new Promise(
        (resolve) => {
          const test =
            new Image();

          test.onload =
            () => resolve(true);

          test.onerror =
            () => resolve(false);

          test.src =
            `${url}?cb=${Date.now()}`;
        }
      );
    }

    async function loadLatestGoes() {
      const start =
        roundDownToTenMinutes(
          new Date()
        );

      start.setUTCMinutes(
        start.getUTCMinutes() -
        GOES_DELAY_MINUTES
      );

      for (
        let i = 0;
        i < GOES_CANDIDATES;
        i++
      ) {
        const candidateDate =
          new Date(
            start.getTime() -
            i *
            IMAGE_INTERVAL_MINUTES *
            60000
          );

        const url =
          buildGoesUrl(candidateDate);

        if (await testImage(url)) {
          GOES_IMAGE.src =
            `${url}?cb=${Date.now()}`;

          return;
        }
      }
    }

    function loadLatestMeteosat() {
      METEOSAT_IMAGE.src =
        `${METEOSAT_WMS_BASE}&cb=${Date.now()}`;
    }

    function refreshImages() {
      loadLatestGoes();
      loadLatestMeteosat();
    }

    refreshImages();

    setInterval(
      refreshImages,
      REFRESH_INTERVAL_MS
    );
  </script>
</body>
</html>
