name: Build global geostationary video

on:
  workflow_dispatch:

  schedule:
    # Rebuild four times daily.
    # GitHub Actions schedules use UTC.
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ffmpeg \
            libcairo2 \
            fonts-dejavu-core \
            fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install \
            --upgrade \
            pillow \
            cairosvg

      - name: Prepare static site
        run: |
          python scripts/prepare_site.py

      - name: Preserve other generated videos
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o site/nasa-earth-observatory.mp4 \
            https://jgclark1.github.io/fau-geosciences-signage/nasa-earth-observatory.mp4

          curl -fL --retry 3 --retry-delay 2 \
            -o site/goes-east-24h.mp4 \
            https://jgclark1.github.io/fau-geosciences-signage/goes-east-24h.mp4

      - name: Build paired global geostationary video
        run: |
          python scripts/build_global_geostationary_video.py

      - name: Finalize remaining player cache tokens
        run: |
          python scripts/finalize_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
