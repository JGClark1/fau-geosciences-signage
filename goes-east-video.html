<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>GOES-East 48-Hour GeoColor Loop</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #goes-video {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /*
      The video itself is 16:9, with the square GOES image
      centered inside it. These panels occupy the resulting
      black margins without covering the Earth.
    */

    #information {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 2.1%;
      width: 17%;
      max-width: 330px;
      transform: translateY(-50%);
      color: #fff;
      pointer-events: none;
    }

    #information h1 {
      margin: 0 0 14px;
      font-size: clamp(24px, 2vw, 38px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    #information .subtitle {
      margin: 0 0 18px;
      font-size: clamp(18px, 1.35vw, 25px);
      line-height: 1.25;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
    }

    #information .description {
      margin: 0;
      font-size: clamp(15px, 1.05vw, 20px);
      line-height: 1.42;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.78);
    }

    #information::before {
      content: "";
      display: block;
      width: 58px;
      height: 4px;
      margin-bottom: 20px;
      border-radius: 2px;
      background: rgba(111, 190, 255, 0.95);
    }

    #attribution {
      position: absolute;
      z-index: 2;
      right: 2.1%;
      bottom: 5%;
      width: 16%;
      max-width: 290px;
      text-align: right;
      color: rgba(255, 255, 255, 0.82);
      pointer-events: none;
    }

    #attribution .source {
      margin: 0 0 6px;
      font-size: clamp(15px, 1vw, 19px);
      line-height: 1.25;
      font-weight: 600;
    }

    #attribution .update {
      margin: 0;
      font-size: clamp(13px, 0.85vw, 17px);
      line-height: 1.3;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.62);
    }

    /*
      On unusually narrow screens, hide the side information
      rather than allowing it to overlap the satellite image.
      The hallway display's 16:9 layout will show both panels.
    */
    @media (max-aspect-ratio: 3 / 2) {
      #information,
      #attribution {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="viewer">

    <video
      id="goes-video"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>

    <section id="information" aria-label="Animation description">
      <h1>GOES-East GeoColor</h1>

      <p class="subtitle">
        48-hour satellite loop
      </p>

      <p class="description">
        Observe cloud movement, evolving weather systems,
        and the changing pattern of daylight across the
        Western Hemisphere.
      </p>
    </section>

    <aside id="attribution" aria-label="Source information">
      <p class="source">
        NOAA / NESDIS / STAR
      </p>

      <p class="update">
        Updated every six hours
      </p>
    </aside>

  </div>

  <script>
    const video = document.getElementById("goes-video");

    /*
      GitHub Actions replaces this placeholder in the
      deployed copy. Each rebuilt movie receives a fresh
      URL, while repeated Appspace appearances can reuse
      the cached video between builds.
    */
    const buildToken = "__BUILD_TOKEN__";

    video.src =
      `goes-east-24h.mp4?v=${encodeURIComponent(buildToken)}`;

    function startVideo() {
      video.play().catch(() => {
        window.setTimeout(() => {
          video.play().catch(() => {});
        }, 1000);
      });
    }

    video.addEventListener("canplay", startVideo);

    startVideo();
  </script>
</body>
</html>
