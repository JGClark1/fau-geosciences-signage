<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>GOES-East 48-Hour GeoColor Loop</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #goes-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #explanation {
      position: absolute;
      top: 28px;
      left: 30px;
      max-width: 430px;
      padding: 16px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      pointer-events: none;
    }

    #explanation h1 {
      margin: 0 0 7px;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 700;
    }

    #explanation p {
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>

<body>
  <div id="viewer">
    <video
      id="goes-video"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>

    <div id="explanation">
      <h1>GOES-East GeoColor</h1>
      <p>
        48 hours of cloud movement and changing daylight
        across the Western Hemisphere
      </p>
    </div>
  </div>

  <script>
    const video = document.getElementById("goes-video");

    /*
      GitHub Actions replaces this placeholder in the
      deployed copy. Each rebuilt movie receives a fresh
      URL, while repeated card appearances can reuse the
      cached video between builds.
    */
    const buildToken = "__BUILD_TOKEN__";

    video.src =
      `goes-east-24h.mp4?v=${encodeURIComponent(buildToken)}`;

    function startVideo() {
      video.play().catch(() => {
        window.setTimeout(() => {
          video.play().catch(() => {});
        }, 1000);
      });
    }

    video.addEventListener("canplay", startVideo);

    startVideo();
  </script>
</body>
</html>
