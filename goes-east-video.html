<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>GOES-East 24-Hour GeoColor Loop</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #goes-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status {
      position: absolute;
      left: 30px;
      bottom: 24px;
      display: none;
      padding: 10px 15px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      font: 20px Arial, Helvetica, sans-serif;
    }
  </style>
</head>

<body>
  <video
    id="goes-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  ></video>

  <div id="status">
    Loading GOES-East animation…
  </div>

  <script>
    const video = document.getElementById("goes-video");
    const status = document.getElementById("status");

    /*
      The GitHub Actions build replaces this placeholder
      in the deployed copy of the page. Each new movie
      therefore receives a unique URL, while repeated card
      appearances continue to reuse the same cached movie.
    */
    const buildToken = "__BUILD_TOKEN__";

    video.src =
      `goes-east-24h.mp4?v=${encodeURIComponent(buildToken)}`;

    function showStatus(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    function hideStatus() {
      status.style.display = "none";
    }

    function startVideo() {
      video.play().catch(() => {
        showStatus("Starting GOES-East animation…");

        window.setTimeout(() => {
          video.play().catch(() => {
            showStatus(
              "GOES-East animation is temporarily unavailable."
            );
          });
        }, 2000);
      });
    }

    video.addEventListener("loadstart", () => {
      showStatus("Loading GOES-East animation…");
    });

    video.addEventListener("waiting", () => {
      showStatus("Loading GOES-East animation…");
    });

    video.addEventListener("playing", hideStatus);

    video.addEventListener("canplay", startVideo);

    video.addEventListener("error", () => {
      showStatus(
        "GOES-East animation is temporarily unavailable."
      );
    });

    startVideo();
  </script>
</body>
</html>
