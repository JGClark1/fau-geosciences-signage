<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>GOES-East 48-Hour GeoColor Loop</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #goes-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>
  <video
    id="goes-video"
    autoplay
    muted
    playsinline
    preload="auto"
  ></video>

  <script>
    const video = document.getElementById("goes-video");

    /*
      GitHub Actions replaces this placeholder in the
      deployed copy. Each rebuilt movie therefore receives
      a fresh URL while repeated card appearances can reuse
      the cached video between builds.
    */
    const buildToken = "__BUILD_TOKEN__";

    video.src =
      `goes-east-24h.mp4?v=${encodeURIComponent(buildToken)}`;

    function startVideo() {
      video.play().catch(() => {
        window.setTimeout(() => {
          video.play().catch(() => {});
        }, 1000);
      });
    }

    video.addEventListener("canplay", startVideo);

    startVideo();
  </script>
</body>
</html>
