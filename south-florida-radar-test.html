<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>South Florida Weather Radar</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    html,
    body,
    #viewer,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #d9d9d9;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      position: relative;
      background: #d9d9d9;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .leaflet-control-zoom {
      display: none;
    }

    .leaflet-control-attribution {
      padding: 3px 6px;
      background: rgba(255, 255, 255, 0.86);
      font-size: 10px;
      line-height: 1.2;
    }

    #title-panel {
      position: absolute;
      z-index: 1000;
      top: 4.5%;
      right: 2.1%;
      width: 22%;
      max-width: 390px;
      padding: 18px 20px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      pointer-events: none;
    }

    #title-panel::before {
      content: "";
      display: block;
      width: 58px;
      height: 4px;
      margin-bottom: 18px;
      border-radius: 2px;
      background: rgba(111, 190, 255, 0.95);
    }

    #title-panel h1 {
      margin: 0;
      font-size: clamp(26px, 2vw, 38px);
      line-height: 1.08;
      font-weight: 700;
    }

    #timestamp-panel {
      position: absolute;
      z-index: 1000;
      right: 2.1%;
      bottom: 4.5%;
      min-width: 250px;
      padding: 12px 16px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      text-align: right;
      pointer-events: none;
    }

    #frame-time {
      margin: 0;
      font-size: clamp(16px, 1.05vw, 21px);
      line-height: 1.25;
      font-weight: 600;
    }

    .location-marker {
      width: 16px;
      height: 16px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #1595d3;
      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.42),
        0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .fau-tooltip {
      padding: 5px 8px;
      border: 0;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.76);
      box-shadow: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .fau-tooltip::before {
      display: none;
    }

    @media (max-aspect-ratio: 3 / 2) {
      #title-panel {
        top: 24px;
        right: 24px;
        width: 340px;
      }

      #timestamp-panel {
        right: 24px;
        bottom: 34px;
      }
    }
  </style>
</head>

<body>
  <div id="viewer">
    <div id="map"></div>

    <section id="title-panel" aria-label="Map title">
      <h1>South Florida Weather Radar</h1>
    </section>

    <aside id="timestamp-panel" aria-label="Radar time">
      <p id="frame-time">
        Loading recent radar…
      </p>
    </aside>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    const RAINVIEWER_API =
      "https://api.rainviewer.com/public/weather-maps.json";

    const MAP_CENTER = [26.58, -80.28];
    const MAP_ZOOM = 9;

    const NUMBER_OF_FRAMES = 6;
    const FRAME_DURATION_MS = 850;
    const FINAL_FRAME_PAUSE_MS = 2200;
    const DATA_REFRESH_MS = 10 * 60 * 1000;
    const TILE_LOAD_TIMEOUT_MS = 4500;

    const frameTimeElement =
      document.getElementById("frame-time");

    const map = L.map("map", {
      center: MAP_CENTER,
      zoom: MAP_ZOOM,
      minZoom: MAP_ZOOM,
      maxZoom: MAP_ZOOM,
      zoomControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      touchZoom: false,
      tap: false,
      attributionControl: true
    });

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_nolabels/" +
      "{z}/{x}/{y}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        attribution:
          "&copy; OpenStreetMap contributors " +
          "&copy; CARTO"
      }
    ).addTo(map);

    map.createPane("radarPane");
    map.getPane("radarPane").style.zIndex = 350;

    map.createPane("labelPane");
    map.getPane("labelPane").style.zIndex = 450;
    map.getPane("labelPane").style.pointerEvents = "none";

    map.createPane("markerPane");
    map.getPane("markerPane").style.zIndex = 500;

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_only_labels/" +
      "{z}/{x}/{y}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        pane: "labelPane"
      }
    ).addTo(map);

    const FAU_LOCATION = [26.3726, -80.1023];

    const locationIcon = L.divIcon({
      className: "",
      html: '<div class="location-marker"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    L.marker(FAU_LOCATION, {
      icon: locationIcon,
      interactive: false,
      pane: "markerPane"
    })
      .addTo(map)
      .bindTooltip("FAU", {
        permanent: true,
        direction: "right",
        offset: [10, 0],
        className: "fau-tooltip"
      });

    let radarLayers = [];
    let radarFrames = [];
    let currentFrameIndex = 0;
    let animationTimer = null;

    function formatRadarTime(unixTimestamp) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      }).format(new Date(unixTimestamp * 1000));
    }

    function stopAnimation() {
      if (animationTimer !== null) {
        window.clearTimeout(animationTimer);
        animationTimer = null;
      }
    }

    function removeCurrentRadarLayers() {
      radarLayers.forEach((layer) => {
        map.removeLayer(layer);
      });

      radarLayers = [];
      radarFrames = [];
    }

    function showFrame(index) {
      radarLayers.forEach((layer, layerIndex) => {
        layer.setOpacity(
          layerIndex === index ? 0.78 : 0
        );
      });

      currentFrameIndex = index;

      frameTimeElement.textContent =
        formatRadarTime(radarFrames[index].time);
    }

    function scheduleNextFrame() {
      const isFinalFrame =
        currentFrameIndex === radarFrames.length - 1;

      const delay = isFinalFrame
        ? FINAL_FRAME_PAUSE_MS
        : FRAME_DURATION_MS;

      animationTimer = window.setTimeout(() => {
        const nextFrameIndex =
          (currentFrameIndex + 1) % radarFrames.length;

        showFrame(nextFrameIndex);
        scheduleNextFrame();
      }, delay);
    }

    function startAnimation() {
      stopAnimation();

      if (radarLayers.length === 0) {
        return;
      }

      showFrame(0);
      scheduleNextFrame();
    }

    function waitForLayer(layer) {
      return new Promise((resolve) => {
        let finished = false;

        const finish = () => {
          if (finished) {
            return;
          }

          finished = true;
          resolve();
        };

        layer.once("load", finish);
        window.setTimeout(finish, TILE_LOAD_TIMEOUT_MS);
      });
    }

    async function loadRadar() {
      frameTimeElement.textContent =
        "Updating recent radar…";

      try {
        const response = await fetch(
          RAINVIEWER_API,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `RainViewer returned HTTP ${response.status}`
          );
        }

        const data = await response.json();

        if (
          !data.radar ||
          !Array.isArray(data.radar.past) ||
          data.radar.past.length === 0
        ) {
          throw new Error(
            "No radar frames were returned."
          );
        }

        const newFrames =
          data.radar.past.slice(-NUMBER_OF_FRAMES);

        const newLayers = newFrames.map((frame) => {
          const tileUrl =
            `${data.host}${frame.path}` +
            "/512/{z}/{x}/{y}/2/1_0.png";

          return L.tileLayer(tileUrl, {
            pane: "radarPane",
            tileSize: 256,
            opacity: 0,
            maxNativeZoom: 7,
            maxZoom: 10,
            updateWhenIdle: true,
            updateWhenZooming: false,
            keepBuffer: 1,
            attribution:
              'Weather data by ' +
              '<a href="https://www.rainviewer.com/">' +
              "RainViewer</a>"
          });
        });

        stopAnimation();
        removeCurrentRadarLayers();

        radarFrames = newFrames;
        radarLayers = newLayers;

        const loadPromises = radarLayers.map((layer) => {
          const promise = waitForLayer(layer);
          layer.addTo(map);
          return promise;
        });

        await Promise.all(loadPromises);

        startAnimation();
      } catch (error) {
        console.error(error);

        frameTimeElement.textContent =
          "Radar temporarily unavailable";

        if (radarLayers.length > 0) {
          startAnimation();
        }
      }
    }

    loadRadar();

    window.setInterval(
      loadRadar,
      DATA_REFRESH_MS
    );
  </script>
</body>
</html>
