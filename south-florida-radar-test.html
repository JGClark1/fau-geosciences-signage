<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>South Florida Radar Test</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9d9d9;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .leaflet-control-zoom {
      display: none;
    }

    .leaflet-control-attribution {
      padding: 4px 7px;
      background: rgba(255, 255, 255, 0.84);
      font-size: 11px;
    }

    #status {
      position: absolute;
      z-index: 1000;
      top: 18px;
      left: 50%;
      min-width: 260px;
      padding: 10px 16px;
      border-radius: 6px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      text-align: center;
      font-size: 17px;
      line-height: 1.25;
      pointer-events: none;
    }

    #fau-label {
      position: absolute;
      z-index: 1000;
      right: 18px;
      bottom: 34px;
      padding: 8px 12px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 15px;
      pointer-events: none;
    }

    .location-marker {
      width: 16px;
      height: 16px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #1595d3;
      box-shadow:
        0 0 0 3px rgba(0, 0, 0, 0.42),
        0 2px 6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="status">
    Loading current radar…
  </div>

  <div id="fau-label">
    FAU Boca Raton
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    const RAINVIEWER_API =
      "https://api.rainviewer.com/public/weather-maps.json";

    /*
      Centered farther east and north than the first test,
      with Palm Beach County as the focus.
    */
    const MAP_CENTER = [26.58, -80.28];
    const MAP_ZOOM = 9;

    /*
      Approximately one hour of radar history.
    */
    const NUMBER_OF_FRAMES = 6;

    const FRAME_DURATION_MS = 850;
    const FINAL_FRAME_PAUSE_MS = 2200;

    /*
      Refresh the available frame list every ten minutes.
    */
    const DATA_REFRESH_MS = 10 * 60 * 1000;

    const statusElement =
      document.getElementById("status");

    const map = L.map("map", {
      center: MAP_CENTER,
      zoom: MAP_ZOOM,
      minZoom: MAP_ZOOM,
      maxZoom: MAP_ZOOM,

      zoomControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      touchZoom: false,
      tap: false,

      attributionControl: true
    });

    /*
      CARTO light basemap without labels.
    */
    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_nolabels/" +
      "{z}/{x}/{y}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        attribution:
          "&copy; OpenStreetMap contributors " +
          "&copy; CARTO"
      }
    ).addTo(map);

    /*
      Dedicated panes guarantee this order:

      1. basemap
      2. radar
      3. place-name and road labels
      4. FAU marker
    */
    map.createPane("radarPane");
    map.getPane("radarPane").style.zIndex = 350;

    map.createPane("labelPane");
    map.getPane("labelPane").style.zIndex = 450;
    map.getPane("labelPane").style.pointerEvents = "none";

    map.createPane("markerPane");
    map.getPane("markerPane").style.zIndex = 500;

    /*
      Labels remain visible above the radar.
    */
    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_only_labels/" +
      "{z}/{x}/{y}.png",
      {
        subdomains: "abcd",
        maxZoom: 20,
        pane: "labelPane"
      }
    ).addTo(map);

    /*
      Approximate FAU Boca Raton campus location.
    */
    const FAU_LOCATION = [26.3726, -80.1023];

    const locationIcon = L.divIcon({
      className: "",
      html: '<div class="location-marker"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    L.marker(FAU_LOCATION, {
      icon: locationIcon,
      interactive: false,
      pane: "markerPane"
    }).addTo(map);

    let radarLayers = [];
    let radarFrames = [];
    let currentFrameIndex = 0;
    let animationTimer = null;

    function formatRadarTime(unixTimestamp) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date(unixTimestamp * 1000));
    }

    function stopAnimation() {
      if (animationTimer !== null) {
        window.clearTimeout(animationTimer);
        animationTimer = null;
      }
    }

    function removeCurrentRadarLayers() {
      radarLayers.forEach((layer) => {
        map.removeLayer(layer);
      });

      radarLayers = [];
      radarFrames = [];
    }

    function showFrame(index) {
      radarLayers.forEach((layer, layerIndex) => {
        layer.setOpacity(
          layerIndex === index ? 0.78 : 0
        );
      });

      currentFrameIndex = index;

      statusElement.textContent =
        `Radar: ${formatRadarTime(
          radarFrames[index].time
        )}`;
    }

    function scheduleNextFrame() {
      const isFinalFrame =
        currentFrameIndex === radarFrames.length - 1;

      const delay = isFinalFrame
        ? FINAL_FRAME_PAUSE_MS
        : FRAME_DURATION_MS;

      animationTimer = window.setTimeout(() => {
        const nextFrameIndex =
          (currentFrameIndex + 1) %
          radarFrames.length;

        showFrame(nextFrameIndex);
        scheduleNextFrame();
      }, delay);
    }

    function startAnimation() {
      stopAnimation();

      if (radarLayers.length === 0) {
        return;
      }

      showFrame(0);
      scheduleNextFrame();
    }

    async function loadRadar() {
      statusElement.textContent =
        "Updating current radar…";

      try {
        const response = await fetch(
          RAINVIEWER_API,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `RainViewer returned HTTP ${response.status}`
          );
        }

        const data = await response.json();

        if (
          !data.radar ||
          !Array.isArray(data.radar.past) ||
          data.radar.past.length === 0
        ) {
          throw new Error(
            "No radar frames were returned."
          );
        }

        const newFrames =
          data.radar.past.slice(-NUMBER_OF_FRAMES);

        const newLayers = newFrames.map((frame) => {
          const tileUrl =
            `${data.host}${frame.path}` +
            "/512/{z}/{x}/{y}/2/1_0.png";

          return L.tileLayer(tileUrl, {
            pane: "radarPane",

            /*
              The server image is 512 pixels, but it occupies
              one standard 256-pixel map-tile footprint.
            */
            tileSize: 256,

            opacity: 0,

            /*
              RainViewer's free native radar limit is zoom 7.
              Leaflet enlarges those tiles at zoom 9.
            */
            maxNativeZoom: 7,
            maxZoom: 10,

            updateWhenIdle: true,
            updateWhenZooming: false,
            keepBuffer: 1,

            attribution:
              'Weather data by ' +
              '<a href="https://www.rainviewer.com/">' +
              "RainViewer</a>"
          });
        });

        stopAnimation();
        removeCurrentRadarLayers();

        radarFrames = newFrames;
        radarLayers = newLayers;

        radarLayers.forEach((layer) => {
          layer.addTo(map);
        });

        /*
          Allow the browser to begin loading the new tiles
          before starting the animation.
        */
        window.setTimeout(
          startAnimation,
          1800
        );
      } catch (error) {
        console.error(error);

        statusElement.textContent =
          "Radar temporarily unavailable";

        if (radarLayers.length > 0) {
          startAnimation();
        }
      }
    }

    loadRadar();

    window.setInterval(
      loadRadar,
      DATA_REFRESH_MS
    );
  </script>
</body>
</html>
