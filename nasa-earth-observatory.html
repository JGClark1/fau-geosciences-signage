<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>Earth Observatory Image of the Day</title>

  <style>
    :root {
      --slide-duration: 15000ms;
      --fade-duration: 1200ms;
      --panel-width: 35%;
      --accent: #67b7e8;
      --panel-background: #0b1520;
      --panel-background-secondary: #101f2d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #viewer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    #viewer {
      position: relative;
      display: grid;
      grid-template-columns:
        minmax(480px, var(--panel-width))
        minmax(0, 1fr);
      background: #000;
      isolation: isolate;
    }

    #information-panel {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding:
        clamp(34px, 3.2vw, 66px)
        clamp(34px, 3.1vw, 64px)
        clamp(28px, 2.6vw, 52px);
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          var(--panel-background-secondary) 0%,
          var(--panel-background) 56%,
          #071019 100%
        );
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    #information-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 7px;
      height: 100%;
      background: var(--accent);
    }

    #series-heading {
      margin: 0;
      color: var(--accent);
      font-size: clamp(17px, 1.3vw, 26px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    #series-rule {
      width: 78px;
      height: 4px;
      margin-top: 19px;
      border: 0;
      background: var(--accent);
    }

    #slide-title {
      margin:
        clamp(30px, 3vw, 54px)
        0
        0;
      color: #fff;
      font-size: clamp(34px, 3vw, 60px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    #slide-abstract {
      margin:
        clamp(25px, 2.4vw, 42px)
        0
        0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(17px, 1.35vw, 27px);
      line-height: 1.48;
      font-weight: 400;
      text-wrap: pretty;
    }

    #metadata {
      margin-top: auto;
      padding-top: clamp(24px, 2.2vw, 38px);
    }

    .metadata-item {
      margin-top: 20px;
    }

    .metadata-label {
      display: block;
      margin-bottom: 6px;
      color: rgba(103, 183, 232, 0.95);
      font-size: clamp(12px, 0.85vw, 17px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metadata-value {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(15px, 1.05vw, 21px);
      line-height: 1.3;
      font-weight: 500;
    }

    #panel-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-top: clamp(28px, 2.5vw, 44px);
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    #attribution {
      margin: 0;
      color: rgba(255, 255, 255, 0.64);
      font-size: clamp(12px, 0.8vw, 16px);
      line-height: 1.25;
    }

    #counter {
      flex: 0 0 auto;
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(14px, 0.95vw, 19px);
      line-height: 1.2;
      font-weight: 700;
    }

    #image-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #020509;
    }

    #image-background {
      position: absolute;
      inset: -35px;
      width: calc(100% + 70px);
      height: calc(100% + 70px);
      object-fit: cover;
      transform: scale(1.04);
      filter:
        blur(25px)
        brightness(0.42)
        saturate(0.8);
      opacity: 0.82;
    }

    #image-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.18),
          transparent 12%,
          transparent 88%,
          rgba(0, 0, 0, 0.1)
        );
    }

    #main-image {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #information-panel,
    #image-background,
    #main-image {
      opacity: 1;
      transition:
        opacity var(--fade-duration) ease-in-out;
    }

    #viewer.is-changing #information-panel,
    #viewer.is-changing #image-background,
    #viewer.is-changing #main-image {
      opacity: 0;
    }

    #progress-track {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background: rgba(255, 255, 255, 0.13);
      pointer-events: none;
    }

    #progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    #progress-bar.is-running {
      animation:
        advance-progress
        var(--slide-duration)
        linear
        forwards;
    }

    #status-message {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px;
      background: #071019;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(22px, 2vw, 38px);
      text-align: center;
    }

    #status-message[hidden] {
      display: none;
    }

    @keyframes advance-progress {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @media (max-aspect-ratio: 3 / 2) {
      :root {
        --panel-width: 40%;
      }

      #viewer {
        grid-template-columns:
          minmax(430px, var(--panel-width))
          minmax(0, 1fr);
      }

      #slide-title {
        font-size: clamp(31px, 2.7vw, 50px);
      }

      #slide-abstract {
        font-size: clamp(16px, 1.25vw, 23px);
      }
    }
  </style>
</head>

<body>
  <main
    id="viewer"
    aria-label="Recent images from NASA Earth Observatory"
  >
    <section id="information-panel">
      <header>
        <p id="series-heading">
          Earth Observatory<br>
          Image of the Day
        </p>

        <hr id="series-rule">
      </header>

      <h1 id="slide-title"></h1>

      <p id="slide-abstract"></p>

      <div id="metadata">
        <div class="metadata-item">
          <span class="metadata-label">
            Published
          </span>

          <span
            id="slide-date"
            class="metadata-value"
          ></span>
        </div>

        <div class="metadata-item">
          <span class="metadata-label">
            Image source
          </span>

          <span
            id="image-source"
            class="metadata-value"
          ></span>
        </div>
      </div>

      <footer id="panel-footer">
        <p id="attribution">
          NASA Earth Observatory
        </p>

        <p id="counter"></p>
      </footer>
    </section>

    <section
      id="image-panel"
      aria-label="NASA Earth Observatory image"
    >
      <img
        id="image-background"
        alt=""
        aria-hidden="true"
      >

      <img
        id="main-image"
        alt=""
      >
    </section>

    <div id="progress-track" aria-hidden="true">
      <div id="progress-bar"></div>
    </div>

    <p id="status-message">
      Loading recent NASA Earth Observatory images…
    </p>
  </main>

  <script>
    const DATA_URL =
      "data/nasa-earth-observatory.json";

    const SLIDE_DURATION_MS = 15000;
    const FADE_DURATION_MS = 1200;
    const DATA_REFRESH_MS = 60 * 60 * 1000;

    const viewer =
      document.getElementById("viewer");

    const informationPanel =
      document.getElementById("information-panel");

    const imageBackground =
      document.getElementById("image-background");

    const mainImage =
      document.getElementById("main-image");

    const slideTitle =
      document.getElementById("slide-title");

    const slideAbstract =
      document.getElementById("slide-abstract");

    const slideDate =
      document.getElementById("slide-date");

    const imageSource =
      document.getElementById("image-source");

    const counter =
      document.getElementById("counter");

    const progressBar =
      document.getElementById("progress-bar");

    const statusMessage =
      document.getElementById("status-message");

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;

    function cacheBustedDataUrl() {
      return (
        DATA_URL +
        "?updated=" +
        Date.now()
      );
    }

    function stopSlideTimer() {
      if (slideTimer !== null) {
        window.clearTimeout(slideTimer);
        slideTimer = null;
      }
    }

    function restartProgressBar() {
      progressBar.classList.remove("is-running");

      void progressBar.offsetWidth;

      progressBar.classList.add("is-running");
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(url);
        image.onerror = reject;
        image.src = url;
      });
    }

    function preloadNextSlide() {
      if (slides.length < 2) {
        return;
      }

      const nextIndex =
        (currentIndex + 1) % slides.length;

      const image = new Image();
      image.src = slides[nextIndex].image_url;
    }

    function applySlide(slide, index) {
      imageBackground.src = slide.image_url;
      mainImage.src = slide.image_url;
      mainImage.alt =
        slide.image_alt || slide.title;

      slideTitle.textContent =
        slide.title;

      slideAbstract.textContent =
        slide.abstract ||
        slide.short_description ||
        "";

      slideDate.textContent =
        slide.display_date;

      imageSource.textContent =
        slide.image_source ||
        "NASA Earth observation";

      counter.textContent =
        `${index + 1} of ${slides.length}`;

      currentIndex = index;

      restartProgressBar();
      preloadNextSlide();
    }

    async function showSlide(index, immediate = false) {
      if (!slides.length) {
        return;
      }

      stopSlideTimer();

      const normalizedIndex =
        ((index % slides.length) + slides.length)
        % slides.length;

      const slide =
        slides[normalizedIndex];

      try {
        await preloadImage(slide.image_url);
      } catch (error) {
        console.error(
          "Unable to load NASA image:",
          slide.image_url,
          error
        );

        scheduleNextSlide(normalizedIndex);
        return;
      }

      if (immediate) {
        applySlide(slide, normalizedIndex);
      } else {
        viewer.classList.add("is-changing");

        window.setTimeout(() => {
          applySlide(slide, normalizedIndex);
          viewer.classList.remove("is-changing");
        }, FADE_DURATION_MS);
      }

      slideTimer = window.setTimeout(
        () => {
          showSlide(normalizedIndex + 1);
        },
        immediate
          ? SLIDE_DURATION_MS
          : SLIDE_DURATION_MS + FADE_DURATION_MS
      );
    }

    function scheduleNextSlide(index) {
      slideTimer = window.setTimeout(
        () => {
          showSlide(index + 1);
        },
        1000
      );
    }

    function validSlides(items) {
      return items.filter((item) => {
        return Boolean(
          item &&
          item.title &&
          item.image_url &&
          item.display_date
        );
      });
    }

    async function loadSlides({
      preserveCurrentSlide = false
    } = {}) {
      try {
        const response = await fetch(
          cacheBustedDataUrl(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `Slideshow data returned HTTP ${response.status}`
          );
        }

        const payload = await response.json();
        const newSlides = validSlides(payload.items || []);

        if (!newSlides.length) {
          throw new Error(
            "No usable NASA slideshow entries were found."
          );
        }

        let nextIndex = 0;

        if (
          preserveCurrentSlide &&
          slides.length &&
          slides[currentIndex]
        ) {
          const currentArticle =
            slides[currentIndex].article_url;

          const matchingIndex =
            newSlides.findIndex(
              (item) =>
                item.article_url === currentArticle
            );

          if (matchingIndex >= 0) {
            nextIndex = matchingIndex;
          }
        }

        slides = newSlides;
        statusMessage.hidden = true;

        await showSlide(
          nextIndex,
          true
        );
      } catch (error) {
        console.error(error);

        if (!slides.length) {
          statusMessage.textContent =
            "NASA Earth Observatory images are temporarily unavailable.";

          statusMessage.hidden = false;
        }
      }
    }

    loadSlides();

    window.setInterval(
      () => {
        loadSlides({
          preserveCurrentSlide: true
        });
      },
      DATA_REFRESH_MS
    );
  </script>
</body>
</html>
