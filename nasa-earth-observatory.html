<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>Earth Observatory Image of the Day</title>

  <style>
    :root {
      --story-duration: 10000ms;
      --comparison-half: 5000ms;
      --story-fade-duration: 900ms;
      --comparison-fade-duration: 500ms;
      --panel-width: 37%;
      --accent: #67b7e8;
      --panel-background: #0b1520;
      --panel-background-secondary: #101f2d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #viewer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    #viewer {
      position: relative;
      display: grid;
      grid-template-columns:
        minmax(500px, var(--panel-width))
        minmax(0, 1fr);
      background: #000;
      isolation: isolate;
    }

    #information-panel {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding:
        clamp(28px, 2.5vw, 48px)
        clamp(34px, 2.8vw, 56px)
        clamp(25px, 2.2vw, 42px);
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          var(--panel-background-secondary) 0%,
          var(--panel-background) 56%,
          #071019 100%
        );
      border-right:
        1px solid rgba(255, 255, 255, 0.1);
    }

    #information-panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: var(--accent);
    }

    #series-heading {
      margin: 0;
      color: var(--accent);
      font-size:
        clamp(15px, 1.05vw, 21px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    #series-rule {
      width: 72px;
      height: 4px;
      margin: 16px 0 0;
      border: 0;
      background: var(--accent);
    }

    #slide-title {
      margin:
        clamp(25px, 2.2vw, 39px)
        0
        0;
      color: #fff;
      font-size:
        clamp(29px, 2.35vw, 46px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    #slide-abstract {
      margin:
        clamp(20px, 1.8vw, 31px)
        0
        0;
      color:
        rgba(255, 255, 255, 0.88);
      font-size:
        clamp(15px, 1.08vw, 21px);
      line-height: 1.43;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    #metadata {
      margin-top: auto;
      padding-top:
        clamp(18px, 1.6vw, 28px);
    }

    .metadata-item {
      margin-top: 15px;
    }

    .metadata-label {
      display: block;
      margin-bottom: 4px;
      color:
        rgba(103, 183, 232, 0.95);
      font-size:
        clamp(11px, 0.7vw, 14px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metadata-value {
      display: block;
      color:
        rgba(255, 255, 255, 0.9);
      font-size:
        clamp(13px, 0.9vw, 18px);
      line-height: 1.28;
      font-weight: 500;
    }

    #panel-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-top:
        clamp(18px, 1.6vw, 28px);
      padding-top: 15px;
      border-top:
        1px solid rgba(255, 255, 255, 0.14);
    }

    #attribution {
      margin: 0;
      color:
        rgba(255, 255, 255, 0.64);
      font-size:
        clamp(11px, 0.72vw, 14px);
    }

    #counter {
      margin: 0;
      color:
        rgba(255, 255, 255, 0.9);
      font-size:
        clamp(13px, 0.82vw, 17px);
      font-weight: 700;
    }

    #media-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #020509;
    }

    #main-image,
    #main-video {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #020509;
    }

    /*
      Still images fill the entire media panel.
      Some edge cropping is intentional.
    */
    #main-image {
      object-fit: cover;
      object-position: center;
    }

    /*
      Videos remain uncropped so legends, coastlines,
      and geographic extents remain visible.
    */
    #main-video {
      object-fit: contain;
    }

    #media-panel::after {
      content: "";
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.13),
          transparent 12%,
          transparent 88%,
          rgba(0, 0, 0, 0.08)
        );
    }

    #comparison-fade {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
      background: #000;
      opacity: 0;
      transition:
        opacity
        var(--comparison-fade-duration)
        ease-in-out;
    }

    #comparison-fade.is-dark {
      opacity: 1;
    }

    #comparison-badge {
      position: absolute;
      z-index: 5;
      right:
        clamp(22px, 2vw, 38px);
      bottom:
        clamp(22px, 2vw, 38px);
      min-width: 185px;
      padding: 13px 17px 12px;
      background:
        rgba(4, 13, 22, 0.87);
      border-left:
        5px solid var(--accent);
      box-shadow:
        0 6px 25px rgba(0, 0, 0, 0.35);
    }

    #comparison-role {
      display: block;
      color: var(--accent);
      font-size:
        clamp(16px, 1.15vw, 23px);
      font-weight: 800;
      letter-spacing: 0.09em;
    }

    #comparison-date {
      display: block;
      margin-top: 4px;
      color: #fff;
      font-size:
        clamp(13px, 0.9vw, 18px);
      font-weight: 600;
    }

    [hidden] {
      display: none !important;
    }

    #information-panel,
    #media-panel {
      opacity: 1;
      transition:
        opacity
        var(--story-fade-duration)
        ease-in-out;
    }

    #viewer.is-changing
    #information-panel,
    #viewer.is-changing
    #media-panel {
      opacity: 0;
    }

    #progress-track {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background:
        rgba(255, 255, 255, 0.13);
      pointer-events: none;
    }

    #progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    #progress-bar.is-running {
      animation:
        advance-progress
        var(--story-duration)
        linear
        forwards;
    }

    #status-message {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px;
      background: #071019;
      color:
        rgba(255, 255, 255, 0.9);
      font-size:
        clamp(22px, 2vw, 38px);
      text-align: center;
    }

    @keyframes advance-progress {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @media (max-aspect-ratio: 3 / 2) {
      :root {
        --panel-width: 42%;
      }

      #viewer {
        grid-template-columns:
          minmax(430px, var(--panel-width))
          minmax(0, 1fr);
      }

      #slide-title {
        font-size:
          clamp(27px, 2.15vw, 40px);
      }

      #slide-abstract {
        font-size:
          clamp(14px, 1vw, 19px);
        line-height: 1.4;
      }
    }
  </style>
</head>

<body>
  <main
    id="viewer"
    aria-label="Recent NASA Earth Observatory stories"
  >
    <section id="information-panel">
      <header>
        <p id="series-heading">
          Earth Observatory Image of the Day:
          <br>
          <span id="heading-date"></span>
        </p>

        <hr id="series-rule">
      </header>

      <h1 id="slide-title"></h1>

      <p id="slide-abstract"></p>

      <div id="metadata">
        <div class="metadata-item">
          <span class="metadata-label">
            Image source
          </span>

          <span
            id="image-source"
            class="metadata-value"
          ></span>
        </div>
      </div>

      <footer id="panel-footer">
        <p id="attribution">
          NASA Earth Observatory
        </p>

        <p id="counter"></p>
      </footer>
    </section>

    <section
      id="media-panel"
      aria-label="NASA Earth Observatory media"
    >
      <img
        id="main-image"
        alt=""
      >

      <video
        id="main-video"
        muted
        loop
        playsinline
        preload="auto"
        hidden
      ></video>

      <div
        id="comparison-fade"
        aria-hidden="true"
      ></div>

      <div
        id="comparison-badge"
        hidden
      >
        <span id="comparison-role"></span>
        <span id="comparison-date"></span>
      </div>
    </section>

    <div
      id="progress-track"
      aria-hidden="true"
    >
      <div id="progress-bar"></div>
    </div>

    <p id="status-message">
      Loading recent NASA Earth Observatory stories…
    </p>
  </main>

  <script>
    const DATA_URL =
      "data/nasa-earth-observatory.json";

    const STORY_DURATION_MS = 10000;
    const COMPARISON_SWITCH_MS = 5000;
    const COMPARISON_FADE_MS = 500;
    const STORY_FADE_MS = 900;
    const DATA_REFRESH_MS =
      60 * 60 * 1000;

    const viewer =
      document.getElementById("viewer");

    const mainImage =
      document.getElementById("main-image");

    const mainVideo =
      document.getElementById("main-video");

    const comparisonFade =
      document.getElementById("comparison-fade");

    const comparisonBadge =
      document.getElementById("comparison-badge");

    const comparisonRole =
      document.getElementById("comparison-role");

    const comparisonDate =
      document.getElementById("comparison-date");

    const headingDate =
      document.getElementById("heading-date");

    const slideTitle =
      document.getElementById("slide-title");

    const slideAbstract =
      document.getElementById("slide-abstract");

    const imageSource =
      document.getElementById("image-source");

    const counter =
      document.getElementById("counter");

    const progressBar =
      document.getElementById("progress-bar");

    const statusMessage =
      document.getElementById("status-message");

    let slides = [];
    let currentIndex = 0;

    let storyTimer = null;
    let comparisonFadeTimer = null;
    let comparisonSwitchTimer = null;
    let transitionTimer = null;

    function clearTimer(timer) {
      if (timer !== null) {
        window.clearTimeout(timer);
      }
    }

    function clearAllTimers() {
      clearTimer(storyTimer);
      clearTimer(comparisonFadeTimer);
      clearTimer(comparisonSwitchTimer);
      clearTimer(transitionTimer);

      storyTimer = null;
      comparisonFadeTimer = null;
      comparisonSwitchTimer = null;
      transitionTimer = null;
    }

    function restartProgressBar() {
      progressBar.classList.remove(
        "is-running"
      );

      void progressBar.offsetWidth;

      progressBar.classList.add(
        "is-running"
      );
    }

    function preloadImage(url) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () =>
            resolve(url);

          image.onerror = () =>
            reject(
              new Error(
                `Unable to preload image: ${url}`
              )
            );

          image.src = url;
        }
      );
    }

    function comparisonItems(slide) {
      if (
        slide.media_type !== "comparison"
        || !Array.isArray(slide.media_items)
      ) {
        return [];
      }

      return slide.media_items
        .slice(0, 2)
        .filter(
          (item) =>
            item
            && item.url
        );
    }

    function primaryMediaUrl(slide) {
      return (
        slide.media_url
        || slide.image_url
        || ""
      );
    }

    async function preloadSlide(slide) {
      if (slide.media_type === "video") {
        if (!primaryMediaUrl(slide)) {
          throw new Error(
            "The video slide has no media URL."
          );
        }

        return;
      }

      if (
        slide.media_type === "comparison"
      ) {
        const items =
          comparisonItems(slide);

        if (items.length < 2) {
          throw new Error(
            "The comparison slide does not contain two images."
          );
        }

        await Promise.all(
          items.map(
            (item) =>
              preloadImage(item.url)
          )
        );

        return;
      }

      const imageUrl =
        primaryMediaUrl(slide);

      if (!imageUrl) {
        throw new Error(
          "The image slide has no media URL."
        );
      }

      await preloadImage(
        imageUrl
      );
    }

    function stopVideo() {
      mainVideo.pause();
      mainVideo.removeAttribute("src");
      mainVideo.load();
      mainVideo.hidden = true;
    }

    function resetComparison() {
      clearTimer(comparisonFadeTimer);
      clearTimer(comparisonSwitchTimer);

      comparisonFadeTimer = null;
      comparisonSwitchTimer = null;

      comparisonFade.classList.remove(
        "is-dark"
      );

      comparisonBadge.hidden = true;
      comparisonRole.textContent = "";
      comparisonDate.textContent = "";
    }

    function updateComparisonBadge(item) {
      comparisonRole.textContent =
        item.label
        || item.role
        || "";

      comparisonDate.textContent =
        item.date
        || "";

      comparisonBadge.hidden = false;
    }

    function displayImage(slide) {
      stopVideo();
      resetComparison();

      const imageUrl =
        primaryMediaUrl(slide);

      mainImage.src = imageUrl;

      mainImage.alt =
        slide.image_alt
        || slide.title;

      mainImage.hidden = false;
    }

    function switchComparisonImage(
      slide,
      item
    ) {
      mainImage.src = item.url;

      mainImage.alt =
        `${slide.title}: ${
          item.label
          || item.role
          || ""
        }`;

      updateComparisonBadge(item);
    }

    function displayComparison(slide) {
      stopVideo();
      resetComparison();

      const items =
        comparisonItems(slide);

      if (items.length < 2) {
        displayImage(slide);
        return;
      }

      const before = items[0];
      const after = items[1];

      mainImage.hidden = false;

      switchComparisonImage(
        slide,
        before
      );

      /*
        At 4.5 seconds, fade to black.
        At 5 seconds, switch to AFTER while fully dark.
        The overlay then fades away over 0.5 seconds.
      */
      comparisonFadeTimer =
        window.setTimeout(
          () => {
            comparisonFade.classList.add(
              "is-dark"
            );
          },
          COMPARISON_SWITCH_MS
          - COMPARISON_FADE_MS
        );

      comparisonSwitchTimer =
        window.setTimeout(
          () => {
            switchComparisonImage(
              slide,
              after
            );

            /*
              Two animation frames ensure that the
              browser has painted the new image behind
              the black overlay before it fades out.
            */
            window.requestAnimationFrame(
              () => {
                window.requestAnimationFrame(
                  () => {
                    comparisonFade.classList.remove(
                      "is-dark"
                    );
                  }
                );
              }
            );
          },
          COMPARISON_SWITCH_MS
        );
    }

    function displayVideo(slide) {
      resetComparison();

      mainImage.hidden = true;
      mainImage.removeAttribute("src");
      mainImage.alt = "";

      stopVideo();

      mainVideo.hidden = false;
      mainVideo.muted = true;
      mainVideo.loop = true;
      mainVideo.playsInline = true;
      mainVideo.src =
        primaryMediaUrl(slide);

      mainVideo.currentTime = 0;
      mainVideo.load();

      const playAttempt =
        mainVideo.play();

      if (
        playAttempt
        && typeof playAttempt.catch
        === "function"
      ) {
        playAttempt.catch(
          (error) => {
            console.error(
              "NASA video autoplay was blocked:",
              error
            );
          }
        );
      }
    }

    function applySlide(
      slide,
      index
    ) {
      if (
        slide.media_type
        === "comparison"
      ) {
        displayComparison(slide);
      } else if (
        slide.media_type
        === "video"
      ) {
        displayVideo(slide);
      } else {
        displayImage(slide);
      }

      headingDate.textContent =
        slide.display_date;

      slideTitle.textContent =
        slide.title;

      slideAbstract.textContent =
        slide.abstract
        || slide.short_description
        || "";

      imageSource.textContent =
        slide.image_source
        || "NASA Earth observation";

      counter.textContent =
        `${index + 1} of ${slides.length}`;

      currentIndex = index;

      restartProgressBar();
    }

    async function showSlide(
      index,
      immediate = false
    ) {
      if (!slides.length) {
        return;
      }

      clearAllTimers();

      const normalizedIndex =
        (
          (index % slides.length)
          + slides.length
        )
        % slides.length;

      const slide =
        slides[normalizedIndex];

      try {
        await preloadSlide(slide);
      } catch (error) {
        console.error(
          "Unable to preload NASA media:",
          error
        );

        storyTimer =
          window.setTimeout(
            () => {
              showSlide(
                normalizedIndex + 1
              );
            },
            1000
          );

        return;
      }

      if (immediate) {
        applySlide(
          slide,
          normalizedIndex
        );
      } else {
        viewer.classList.add(
          "is-changing"
        );

        transitionTimer =
          window.setTimeout(
            () => {
              applySlide(
                slide,
                normalizedIndex
              );

              viewer.classList.remove(
                "is-changing"
              );

              transitionTimer = null;
            },
            STORY_FADE_MS
          );
      }

      storyTimer =
        window.setTimeout(
          () => {
            showSlide(
              normalizedIndex + 1
            );
          },
          STORY_DURATION_MS
          + (
            immediate
              ? 0
              : STORY_FADE_MS
          )
        );
    }

    function validSlides(items) {
      return items.filter(
        (item) => {
          if (
            !item
            || !item.title
            || !item.display_date
          ) {
            return false;
          }

          if (
            item.media_type
            === "comparison"
          ) {
            return (
              comparisonItems(item).length
              >= 2
            );
          }

          return Boolean(
            primaryMediaUrl(item)
          );
        }
      );
    }

    async function loadSlides({
      preserveCurrentSlide = false
    } = {}) {
      try {
        const response =
          await fetch(
            `${DATA_URL}?updated=${Date.now()}`,
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `Slideshow data returned HTTP ${response.status}`
          );
        }

        const payload =
          await response.json();

        const newSlides =
          validSlides(
            payload.items
            || []
          );

        if (!newSlides.length) {
          throw new Error(
            "No usable NASA slideshow entries were found."
          );
        }

        let nextIndex = 0;

        if (
          preserveCurrentSlide
          && slides[currentIndex]
        ) {
          const currentArticle =
            slides[currentIndex]
              .article_url;

          const matchingIndex =
            newSlides.findIndex(
              (item) =>
                item.article_url
                === currentArticle
            );

          if (matchingIndex >= 0) {
            nextIndex =
              matchingIndex;
          }
        }

        slides = newSlides;
        statusMessage.hidden = true;

        await showSlide(
          nextIndex,
          true
        );
      } catch (error) {
        console.error(error);

        if (!slides.length) {
          statusMessage.textContent =
            "NASA Earth Observatory stories are temporarily unavailable.";

          statusMessage.hidden = false;
        }
      }
    }

    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          !document.hidden
          && !mainVideo.hidden
        ) {
          const playAttempt =
            mainVideo.play();

          if (
            playAttempt
            && typeof playAttempt.catch
            === "function"
          ) {
            playAttempt.catch(
              () => {}
            );
          }
        }
      }
    );

    loadSlides();

    window.setInterval(
      () => {
        loadSlides({
          preserveCurrentSlide: true
        });
      },
      DATA_REFRESH_MS
    );
  </script>
</body>
</html>
