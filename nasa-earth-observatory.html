<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>Earth Observatory Image of the Day</title>

  <style>
    :root {
      --slide-duration: 15000ms;
      --fade-duration: 1200ms;
      --panel-width: 37%;
      --accent: #67b7e8;
      --panel-background: #0b1520;
      --panel-background-secondary: #101f2d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #viewer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #fff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    #viewer {
      position: relative;
      display: grid;
      grid-template-columns:
        minmax(500px, var(--panel-width))
        minmax(0, 1fr);
      background: #000;
      isolation: isolate;
    }

    #information-panel {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding:
        clamp(28px, 2.5vw, 48px)
        clamp(34px, 2.8vw, 56px)
        clamp(25px, 2.2vw, 42px);
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          var(--panel-background-secondary) 0%,
          var(--panel-background) 56%,
          #071019 100%
        );
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    #information-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 7px;
      height: 100%;
      background: var(--accent);
    }

    #series-heading {
      margin: 0;
      color: var(--accent);
      font-size: clamp(15px, 1.05vw, 21px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    #series-rule {
      width: 72px;
      height: 4px;
      margin: 16px 0 0;
      border: 0;
      background: var(--accent);
    }

    #slide-title {
      margin:
        clamp(25px, 2.2vw, 39px)
        0
        0;
      color: #fff;
      font-size: clamp(29px, 2.35vw, 46px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    #slide-abstract {
      margin:
        clamp(20px, 1.8vw, 31px)
        0
        0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(15px, 1.08vw, 21px);
      line-height: 1.43;
      font-weight: 400;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      overflow-wrap: break-word;
    }

    #metadata {
      margin-top: auto;
      padding-top: clamp(18px, 1.6vw, 28px);
    }

    .metadata-item {
      margin-top: 15px;
    }

    .metadata-label {
      display: block;
      margin-bottom: 4px;
      color: rgba(103, 183, 232, 0.95);
      font-size: clamp(11px, 0.7vw, 14px);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metadata-value {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(13px, 0.9vw, 18px);
      line-height: 1.28;
      font-weight: 500;
    }

    #panel-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-top: clamp(18px, 1.6vw, 28px);
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    #attribution {
      margin: 0;
      color: rgba(255, 255, 255, 0.64);
      font-size: clamp(11px, 0.72vw, 14px);
      line-height: 1.25;
    }

    #counter {
      flex: 0 0 auto;
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(13px, 0.82vw, 17px);
      line-height: 1.2;
      font-weight: 700;
    }

    #image-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #020509;
    }

    #image-background {
      position: absolute;
      inset: -35px;
      width: calc(100% + 70px);
      height: calc(100% + 70px);
      object-fit: cover;
      transform: scale(1.04);
      filter:
        blur(25px)
        brightness(0.42)
        saturate(0.8);
      opacity: 0.82;
    }

    #image-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.18),
          transparent 12%,
          transparent 88%,
          rgba(0, 0, 0, 0.1)
        );
    }

    #main-image,
    #main-video {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #020509;
    }

    #main-video {
      border: 0;
    }

    #image-background[hidden],
    #main-image[hidden],
    #main-video[hidden] {
      display: none;
    }

    #information-panel,
    #image-background,
    #main-image,
    #main-video {
      opacity: 1;
      transition:
        opacity var(--fade-duration) ease-in-out;
    }

    #viewer.is-changing #information-panel,
    #viewer.is-changing #image-background,
    #viewer.is-changing #main-image,
    #viewer.is-changing #main-video {
      opacity: 0;
    }

    #progress-track {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background: rgba(255, 255, 255, 0.13);
      pointer-events: none;
    }

    #progress-bar {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    #progress-bar.is-running {
      animation:
        advance-progress
        var(--slide-duration)
        linear
        forwards;
    }

    #status-message {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px;
      background: #071019;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(22px, 2vw, 38px);
      text-align: center;
    }

    #status-message[hidden] {
      display: none;
    }

    @keyframes advance-progress {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @media (max-aspect-ratio: 3 / 2) {
      :root {
        --panel-width: 42%;
      }

      #viewer {
        grid-template-columns:
          minmax(430px, var(--panel-width))
          minmax(0, 1fr);
      }

      #slide-title {
        font-size: clamp(27px, 2.15vw, 40px);
      }

      #slide-abstract {
        font-size: clamp(14px, 1vw, 19px);
        line-height: 1.4;
      }
    }
  </style>
</head>

<body>
  <main
    id="viewer"
    aria-label="Recent images and animations from NASA Earth Observatory"
  >
    <section id="information-panel">
      <header>
        <p id="series-heading">
          Earth Observatory Image of the Day:
          <br>
          <span id="heading-date"></span>
        </p>

        <hr id="series-rule">
      </header>

      <h1 id="slide-title"></h1>

      <p id="slide-abstract"></p>

      <div id="metadata">
        <div class="metadata-item">
          <span class="metadata-label">
            Image source
          </span>

          <span
            id="image-source"
            class="metadata-value"
          ></span>
        </div>
      </div>

      <footer id="panel-footer">
        <p id="attribution">
          NASA Earth Observatory
        </p>

        <p id="counter"></p>
      </footer>
    </section>

    <section
      id="image-panel"
      aria-label="NASA Earth Observatory media"
    >
      <img
        id="image-background"
        alt=""
        aria-hidden="true"
      >

      <img
        id="main-image"
        alt=""
      >

      <video
        id="main-video"
        muted
        loop
        playsinline
        preload="auto"
        hidden
      ></video>
    </section>

    <div id="progress-track" aria-hidden="true">
      <div id="progress-bar"></div>
    </div>

    <p id="status-message">
      Loading recent NASA Earth Observatory stories…
    </p>
  </main>

  <script>
    const DATA_URL =
      "data/nasa-earth-observatory.json";

    const SLIDE_DURATION_MS = 15000;
    const FADE_DURATION_MS = 1200;
    const DATA_REFRESH_MS = 60 * 60 * 1000;
    const VIDEO_PRELOAD_TIMEOUT_MS = 12000;

    const viewer =
      document.getElementById("viewer");

    const imageBackground =
      document.getElementById("image-background");

    const mainImage =
      document.getElementById("main-image");

    const mainVideo =
      document.getElementById("main-video");

    const headingDate =
      document.getElementById("heading-date");

    const slideTitle =
      document.getElementById("slide-title");

    const slideAbstract =
      document.getElementById("slide-abstract");

    const imageSource =
      document.getElementById("image-source");

    const counter =
      document.getElementById("counter");

    const progressBar =
      document.getElementById("progress-bar");

    const statusMessage =
      document.getElementById("status-message");

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;
    let transitionTimer = null;

    function cacheBustedDataUrl() {
      return (
        DATA_URL +
        "?updated=" +
        Date.now()
      );
    }

    function stopSlideTimer() {
      if (slideTimer !== null) {
        window.clearTimeout(slideTimer);
        slideTimer = null;
      }

      if (transitionTimer !== null) {
        window.clearTimeout(transitionTimer);
        transitionTimer = null;
      }
    }

    function restartProgressBar() {
      progressBar.classList.remove("is-running");

      void progressBar.offsetWidth;

      progressBar.classList.add("is-running");
    }

    function isVideoSlide(slide) {
      return (
        slide.media_type === "video" &&
        Boolean(slide.media_url)
      );
    }

    function slideMediaUrl(slide) {
      return (
        slide.media_url ||
        slide.image_url ||
        ""
      );
    }

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(url);
        image.onerror = () => {
          reject(
            new Error(
              `Unable to preload image: ${url}`
            )
          );
        };

        image.src = url;
      });
    }

    function preloadVideo(url) {
      return new Promise((resolve, reject) => {
        const video =
          document.createElement("video");

        let settled = false;

        const timeout =
          window.setTimeout(
            () => {
              if (settled) {
                return;
              }

              settled = true;

              video.removeAttribute("src");
              video.load();

              reject(
                new Error(
                  `Video preload timed out: ${url}`
                )
              );
            },
            VIDEO_PRELOAD_TIMEOUT_MS
          );

        function cleanUp() {
          window.clearTimeout(timeout);
          video.removeAttribute("src");
          video.load();
        }

        function finishSuccessfully() {
          if (settled) {
            return;
          }

          settled = true;
          cleanUp();
          resolve(url);
        }

        function finishWithError() {
          if (settled) {
            return;
          }

          settled = true;
          cleanUp();

          reject(
            new Error(
              `Unable to preload video: ${url}`
            )
          );
        }

        video.muted = true;
        video.preload = "auto";
        video.playsInline = true;

        video.addEventListener(
          "loadeddata",
          finishSuccessfully,
          {
            once: true
          }
        );

        video.addEventListener(
          "error",
          finishWithError,
          {
            once: true
          }
        );

        video.src = url;
        video.load();
      });
    }

    function preloadSlideMedia(slide) {
      const mediaUrl =
        slideMediaUrl(slide);

      if (!mediaUrl) {
        return Promise.reject(
          new Error(
            "The slide has no usable media URL."
          )
        );
      }

      if (isVideoSlide(slide)) {
        return preloadVideo(mediaUrl);
      }

      return preloadImage(mediaUrl);
    }

    function preloadNextSlide() {
      if (slides.length < 2) {
        return;
      }

      const nextIndex =
        (currentIndex + 1) % slides.length;

      const nextSlide =
        slides[nextIndex];

      const mediaUrl =
        slideMediaUrl(nextSlide);

      if (!mediaUrl) {
        return;
      }

      if (isVideoSlide(nextSlide)) {
        const video =
          document.createElement("video");

        video.muted = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.src = mediaUrl;
        video.load();

        return;
      }

      const image = new Image();
      image.src = mediaUrl;
    }

    function stopCurrentVideo() {
      mainVideo.pause();
      mainVideo.removeAttribute("src");
      mainVideo.load();
    }

    function displayImageSlide(slide) {
      const mediaUrl =
        slideMediaUrl(slide);

      stopCurrentVideo();

      mainVideo.hidden = true;

      imageBackground.src = mediaUrl;
      imageBackground.hidden = false;

      mainImage.src = mediaUrl;
      mainImage.alt =
        slide.image_alt || slide.title;

      mainImage.hidden = false;
    }

    function displayVideoSlide(slide) {
      const mediaUrl =
        slideMediaUrl(slide);

      mainImage.hidden = true;
      mainImage.removeAttribute("src");
      mainImage.alt = "";

      /*
        The fallback image for some NASA animations is
        only a small location map, so video slides do not
        use it as the blurred background.
      */
      imageBackground.hidden = true;
      imageBackground.removeAttribute("src");

      stopCurrentVideo();

      mainVideo.hidden = false;
      mainVideo.muted = true;
      mainVideo.loop = true;
      mainVideo.playsInline = true;
      mainVideo.src = mediaUrl;
      mainVideo.currentTime = 0;
      mainVideo.load();

      const playAttempt =
        mainVideo.play();

      if (
        playAttempt &&
        typeof playAttempt.catch === "function"
      ) {
        playAttempt.catch((error) => {
          console.error(
            "NASA video autoplay was blocked:",
            error
          );
        });
      }
    }

    function applySlide(slide, index) {
      if (isVideoSlide(slide)) {
        displayVideoSlide(slide);
      } else {
        displayImageSlide(slide);
      }

      headingDate.textContent =
        slide.display_date;

      slideTitle.textContent =
        slide.title;

      slideAbstract.textContent =
        slide.abstract ||
        slide.short_description ||
        "";

      imageSource.textContent =
        slide.image_source ||
        "NASA Earth observation";

      counter.textContent =
        `${index + 1} of ${slides.length}`;

      currentIndex = index;

      restartProgressBar();
      preloadNextSlide();
    }

    async function showSlide(
      index,
      immediate = false
    ) {
      if (!slides.length) {
        return;
      }

      stopSlideTimer();

      const normalizedIndex =
        ((index % slides.length) + slides.length)
        % slides.length;

      const slide =
        slides[normalizedIndex];

      try {
        await preloadSlideMedia(slide);
      } catch (error) {
        console.error(
          "Unable to load NASA slide media:",
          slideMediaUrl(slide),
          error
        );

        scheduleNextSlide(normalizedIndex);
        return;
      }

      if (immediate) {
        applySlide(
          slide,
          normalizedIndex
        );
      } else {
        viewer.classList.add("is-changing");

        transitionTimer =
          window.setTimeout(
            () => {
              applySlide(
                slide,
                normalizedIndex
              );

              viewer.classList.remove(
                "is-changing"
              );

              transitionTimer = null;
            },
            FADE_DURATION_MS
          );
      }

      slideTimer =
        window.setTimeout(
          () => {
            showSlide(normalizedIndex + 1);
          },
          immediate
            ? SLIDE_DURATION_MS
            : SLIDE_DURATION_MS
              + FADE_DURATION_MS
        );
    }

    function scheduleNextSlide(index) {
      slideTimer =
        window.setTimeout(
          () => {
            showSlide(index + 1);
          },
          1000
        );
    }

    function validSlides(items) {
      return items.filter((item) => {
        if (!item) {
          return false;
        }

        const hasMedia =
          Boolean(
            item.media_url ||
            item.image_url
          );

        const validMediaType =
          !item.media_type ||
          item.media_type === "image" ||
          item.media_type === "video";

        return Boolean(
          item.title &&
          item.display_date &&
          hasMedia &&
          validMediaType
        );
      });
    }

    async function loadSlides({
      preserveCurrentSlide = false
    } = {}) {
      try {
        const response = await fetch(
          cacheBustedDataUrl(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `Slideshow data returned HTTP ${response.status}`
          );
        }

        const payload =
          await response.json();

        const newSlides =
          validSlides(payload.items || []);

        if (!newSlides.length) {
          throw new Error(
            "No usable NASA slideshow entries were found."
          );
        }

        let nextIndex = 0;

        if (
          preserveCurrentSlide &&
          slides.length &&
          slides[currentIndex]
        ) {
          const currentArticle =
            slides[currentIndex].article_url;

          const matchingIndex =
            newSlides.findIndex(
              (item) =>
                item.article_url === currentArticle
            );

          if (matchingIndex >= 0) {
            nextIndex = matchingIndex;
          }
        }

        slides = newSlides;
        statusMessage.hidden = true;

        await showSlide(
          nextIndex,
          true
        );
      } catch (error) {
        console.error(error);

        if (!slides.length) {
          statusMessage.textContent =
            "NASA Earth Observatory stories are temporarily unavailable.";

          statusMessage.hidden = false;
        }
      }
    }

    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.hidden ||
          mainVideo.hidden
        ) {
          return;
        }

        const playAttempt =
          mainVideo.play();

        if (
          playAttempt &&
          typeof playAttempt.catch === "function"
        ) {
          playAttempt.catch(() => {});
        }
      }
    );

    loadSlides();

    window.setInterval(
      () => {
        loadSlides({
          preserveCurrentSlide: true
        });
      },
      DATA_REFRESH_MS
    );
  </script>
</body>
</html>
