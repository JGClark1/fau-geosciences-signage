<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>NASA Earth Observatory</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>
  <video
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="nasa-earth-observatory.mp4?v=__BUILD_TOKEN__"
      type="video/mp4"
    >
  </video>
</body>
</html>
