<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <title>Earth in Motion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: relative;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /*
      Title and descriptor are intentionally NOT scaled with
      the 1920x1080 video. This reproduces the approved test
      page, where CSS text remained at its defined pixel size.
    */
    .header-left,
    .header-right {
      position: absolute;
      top: 18px;
      z-index: 20;
      color: #fff;
      pointer-events: none;
    }

    .header-left {
      left: 20px;
      width: 390px;
      padding-left: 12px;
    }

    .header-left::before {
      content: "";
      position: absolute;
      left: 0;
      top: 1px;
      width: 4px;
      height: 42px;
      background: #4db3ff;
    }

    .title-line {
      display: block;
      margin: 0;
      font-weight: 700;
      line-height: 0.98;
      white-space: nowrap;
    }

    .title-line-1 {
      font-size: 22px;
      letter-spacing: 0.15px;
    }

    .title-line-2 {
      margin-top: 5px;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: 0.05px;
      color: #e8e8e8;
    }

    .header-right {
      right: 14px;
      width: 470px;
      text-align: right;
    }

    .description-line {
      display: block;
      margin: 0 0 3px auto;
      color: #e6e6e6;
      font-weight: 400;
      line-height: 1.12;
      white-space: nowrap;
    }

    .description-line-1,
    .description-line-2,
    .description-line-3 {
      font-size: 14.5px;
      letter-spacing: -0.15px;
      word-spacing: -0.35px;
    }

    /*
      Meteosat attribution uses the same CSS dimensions as the
      approved test page. JavaScript positions it over the
      actually displayed right-hand video panel.
    */
    .meteosat-footer {
      position: absolute;
      z-index: 15;

      height: 10.75px;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 8px;
      overflow: hidden;

      background: #fff;
      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 9.75px;
      font-weight: 500;
      line-height: 10.75px;

      white-space: nowrap;
      text-align: center;
      pointer-events: none;
    }

    #eumetsat-logo {
      position: absolute;
      z-index: 16;

      width: 94px;
      height: 94px;
      object-fit: contain;

      pointer-events: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <video
    id="global-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="global-geostationary-48h.mp4?v=__BUILD_TOKEN__"
      type="video/mp4"
    >
  </video>

  <div
    class="header-left"
    aria-label="Display title"
  >
    <span class="title-line title-line-1">
      Earth in Motion
    </span>

    <span class="title-line title-line-2">
      The past 48 hours
    </span>
  </div>

  <div
    class="header-right"
    aria-label="Display description"
  >
    <span class="description-line description-line-1">
      Watch weather evolve across Earth
    </span>

    <span class="description-line description-line-2">
      through the changing cycle
    </span>

    <span class="description-line description-line-3">
      of day and night
    </span>
  </div>

  <div
    class="meteosat-footer"
    id="meteosat-footer"
  >
    EUMETSAT - METEOSAT-12 - GEOCOLOUR Composite
  </div>

  <img
    id="eumetsat-logo"
    src="assets/eumetsat-logo.png?v=__BUILD_TOKEN__"
    alt=""
    aria-hidden="true"
  >

  <script>
    const SOURCE_WIDTH = 1920;
    const SOURCE_HEIGHT = 1080;

    const PANEL_SIZE = 941;
    const PANEL_TOP = (SOURCE_HEIGHT - PANEL_SIZE) / 2;
    const RIGHT_PANEL_X = 962;

    const FOOTER_HEIGHT = 10.75;
    const FOOTER_FONT_SIZE = 9.75;
    const FOOTER_HORIZONTAL_PADDING = 8;
    const FOOTER_OPTICAL_SCALE = 1.32;

    const LOGO_SIZE = 94;
    const LOGO_LEFT_OFFSET = 8;
    const LOGO_OPTICAL_SCALE = 1.55;
    const LOGO_VERTICAL_OFFSET = 17;

    const video =
      document.getElementById("global-video");

    const footer =
      document.getElementById("meteosat-footer");

    const logo =
      document.getElementById("eumetsat-logo");

    let metadata = null;

    function positionMeteosatOverlay() {
      const scale = Math.min(
        window.innerWidth / SOURCE_WIDTH,
        window.innerHeight / SOURCE_HEIGHT
      );

      const renderedWidth =
        SOURCE_WIDTH * scale;

      const renderedHeight =
        SOURCE_HEIGHT * scale;

      const videoLeft =
        (window.innerWidth - renderedWidth) / 2;

      const videoTop =
        (window.innerHeight - renderedHeight) / 2;

      const panelLeft =
        videoLeft + RIGHT_PANEL_X * scale;

      const panelTop =
        videoTop + PANEL_TOP * scale;

      const panelWidth =
        PANEL_SIZE * scale;

      const panelHeight =
        PANEL_SIZE * scale;

      const footerHeight =
        FOOTER_HEIGHT * scale * FOOTER_OPTICAL_SCALE;

      const footerFontSize =
        FOOTER_FONT_SIZE * scale * FOOTER_OPTICAL_SCALE;

      const footerPadding =
        FOOTER_HORIZONTAL_PADDING * scale * FOOTER_OPTICAL_SCALE;

      footer.style.left =
        `${panelLeft}px`;

      footer.style.top =
        `${panelTop + panelHeight - footerHeight}px`;

      footer.style.width =
        `${panelWidth}px`;

      footer.style.height =
        `${footerHeight}px`;

      footer.style.fontSize =
        `${footerFontSize}px`;

      footer.style.lineHeight =
        `${footerHeight}px`;

      footer.style.padding =
        `0 ${footerPadding}px`;

      const logoSize =
        LOGO_SIZE * scale * LOGO_OPTICAL_SCALE;

      const logoLeftOffset =
        LOGO_LEFT_OFFSET * scale;

      logo.style.width =
        `${logoSize}px`;

      logo.style.height =
        `${logoSize}px`;

      logo.style.left =
        `${panelLeft + logoLeftOffset}px`;

      const logoVerticalOffset =
        LOGO_VERTICAL_OFFSET * scale;

      logo.style.top =
        `${panelTop + panelHeight - logoSize + logoVerticalOffset}px`;
    }

    function formatTimestamp(iso) {
      const date = new Date(iso);

      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec"
      ];

      const day =
        String(date.getUTCDate()).padStart(2, "0");

      const month =
        months[date.getUTCMonth()];

      const year =
        date.getUTCFullYear();

      const hour =
        String(date.getUTCHours()).padStart(2, "0");

      const minute =
        String(date.getUTCMinutes()).padStart(2, "0");

      return (
        `${day} ${month} ${year} ` +
        `${hour}:${minute}Z`
      );
    }

    function updateFooter() {
      if (
        metadata &&
        metadata.timestamps &&
        metadata.timestamps.length
      ) {
        const fps =
          metadata.frame_rate || (20 / 3);

        const index = Math.min(
          Math.floor(
            video.currentTime * fps + 0.0001
          ),
          metadata.timestamps.length - 1
        );

        footer.textContent =
          `${formatTimestamp(metadata.timestamps[index])} - ` +
          "EUMETSAT - METEOSAT-12 - GEOCOLOUR Composite";
      }

      requestAnimationFrame(updateFooter);
    }

    fetch(
      "global-geostationary-timestamps.json?v=__BUILD_TOKEN__",
      {
        cache: "no-store"
      }
    )
      .then((response) => {
        if (!response.ok) {
          throw new Error(
            `Metadata request failed: ${response.status}`
          );
        }

        return response.json();
      })
      .then((data) => {
        metadata = data;
      })
      .catch((error) => {
        console.error(error);
      });

    window.addEventListener(
      "resize",
      positionMeteosatOverlay
    );

    positionMeteosatOverlay();
    requestAnimationFrame(updateFooter);
  </script>
</body>
</html>
